aid: link-cell-therapies
name: Link Cell Therapies
description: Link Cell Therapies is a South San Francisco clinical-stage cell therapy company founded
  by Stanford investigators Robbie Majzner and Crystal Mackall in partnership with Samsara BioCapital,
  working on the development of safe and effective CAR T agents for patients with solid tumors. The
  company's logic-gate technology produces AND-gate CAR T cells that require co-expression of two cancer
  targets before driving cell cytotoxicity, giving greater tumor specificity than existing logic-gate
  approaches and aiming to avoid off-tumor toxicity. Alongside additional platforms under development,
  Link is advancing therapeutic programs across solid tumors and certain hematologic cancers, including
  a dual-targeting AND-gated CAR program (LNK001) directed at clear cell renal cell carcinoma, and in
  January 2026 entered a strategic collaboration with Johnson & Johnson to develop logic-gate LINK CAR
  T therapies. Link Cell Therapies publishes no public API, developer portal, or machine-readable
  interface; this profile captures company identity and probed public-surface posture only.
